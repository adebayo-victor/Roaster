<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ workspace.name }}</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #e0e0e0; padding-bottom: 15px; }
        .header h1 { margin: 0; color: #2c3e50; }
        .badge { background: #3498db; color: white; padding: 5px 10px; border-radius: 12px; font-size: 12px; text-transform: uppercase; margin-left: 10px; }
        .back-btn { text-decoration: none; color: #7f8c8d; font-weight: bold; }
        .back-btn:hover { color: #333; }

        .add-btn { background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .add-btn:hover { background: #27ae60; }

        .employee-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .employee-card { background: white; border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .employee-photo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin: 0 auto 10px; background: #eee; display: block; }
        .employee-name { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .employee-role { font-size: 12px; color: #7f8c8d; }

        /* Modal Styles */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 400px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: #e0e0e0; color: #333; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        .btn-save { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <a href="/" class="back-btn">← Back to Folders</a>
            <h1>{{ workspace.name }} <span class="badge">{{ workspace.folder_type }}</span></h1>
        </div>
        <button class="add-btn" onclick="openModal()">+ Add Employee</button>
    </div>

    <div class="employee-grid" id="employeeGrid">
        <!-- Employees will be injected here by JS -->
    </div>

    <!-- Add Employee Modal -->
    <div id="addModal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-top:0;">Add New Employee</h2>
            <form id="employeeForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="empName" required>
                </div>
                <div class="form-group">
                    <label>Role / Position</label>
                    <input type="text" id="empRole" required placeholder="e.g., Manager, Nurse">
                </div>
                <div class="form-group">
                    <label>Profile Photo</label>
                    <input type="file" id="empPhoto" accept="image/*" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-save">Save Employee</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const workspaceId = {{ workspace.id }};
        const grid = document.getElementById('employeeGrid');
        const modal = document.getElementById('addModal');

        function openModal() { modal.style.display = 'flex'; }
        function closeModal() { modal.style.display = 'none'; }

        // Fetch and render employees on load
        async function loadEmployees() {
            const res = await fetch(`/api/workspace/${workspaceId}/employees`);
            const employees = await res.json();
            
            grid.innerHTML = employees.map(emp => `
                <div class="employee-card">
                    <img src="${emp.photo_path.replace('data\\\\', 'data/')}" class="employee-photo" onerror="this.src='static/img/icons/user.png'">
                    <div class="employee-name">${emp.name}</div>
                    <div class="employee-role">${emp.role}</div>
                </div>
            `).join('');
        }

        // Handle Form Submission
        document.getElementById('employeeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('name', document.getElementById('empName').value);
            formData.append('role', document.getElementById('empRole').value);
            formData.append('photo', document.getElementById('empPhoto').files[0]);

            const res = await fetch(`/api/workspace/${workspaceId}/add_employee`, {
                method: 'POST',
                body: formData
            });

            if (res.ok) {
                closeModal();
                document.getElementById('employeeForm').reset();
                loadEmployees(); // Refresh the grid
            } else {
                alert('Error adding employee');
            }
        });

        // Initial load
        loadEmployees();
    </script>

</body>
</html>
