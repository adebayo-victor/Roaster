<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Workforce</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { color: #2c3e50; margin-bottom: 5px; }
        .header p { color: #7f8c8d; }
        
        .folders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        
        .folder-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.2s; border: 2px solid transparent; }
        .folder-card:hover { transform: translateY(-5px); border-color: #3498db; }
        
        .folder-icon { font-size: 48px; margin-bottom: 10px; }
        .folder-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .folder-type { font-size: 12px; color: #7f8c8d; text-transform: uppercase; letter-spacing: 1px; }
        
        .create-btn { background: #3498db; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 40px; display: block; margin-left: auto; margin-right: auto;}
        .create-btn:hover { background: #2980b9; }

        /* Modal Styles */
        .modal-overlay {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: #e0e0e0; color: #333; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        .btn-save { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Smart Workforce Manager</h1>
        <p>Offline-First Roster & Timetable System</p>
    </div>

    <div class="folders-grid">
        {% for ws in workspaces %}
        <div class="folder-card" onclick="openFolder({{ ws.id }})">
            <div class="folder-icon">📁</div>
            <div class="folder-title">{{ ws.name }}</div>
            <div class="folder-type">{{ ws.folder_type }}</div>
        </div>
        {% endfor %}
    </div>

    <button class="create-btn" onclick="openModal()">+ Create New Workspace</button>

    <!-- The Creation Modal -->
    <div id="createModal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-top:0;">New Workspace</h2>
            <form id="workspaceForm">
                <div class="form-group">
                    <label>Workspace Name</label>
                    <input type="text" id="wsName" required placeholder="e.g., Main Office Staff">
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select id="wsType" onchange="toggleFields()" required>
                        <option value="roster">Roster (Fixed Schedule)</option>
                        <option value="timetable">Timetable (Rotating Shifts)</option>
                    </select>
                </div>
                
                <!-- Roster Specific Fields (Hidden if Timetable is selected) -->
                <div id="rosterFields">
                    <div class="form-group">
                        <label>Expected Arrival Time</label>
                        <input type="time" id="wsTime" value="09:00">
                    </div>
                    <div class="form-group">
                        <label>Arrival Buffer (Minutes)</label>
                        <input type="number" id="wsBuffer" value="15" min="0">
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-save">Create</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openFolder(id) {
            // Navigate to the workspace route
            window.location.href = `/workspace/${id}`;
        }

        // Modal Logic
        const modal = document.getElementById('createModal');
        const rosterFields = document.getElementById('rosterFields');

        function openModal() { modal.style.display = 'flex'; }
        function closeModal() { modal.style.display = 'none'; }

        function toggleFields() {
            const type = document.getElementById('wsType').value;
            if (type === 'roster') {
                rosterFields.style.display = 'block';
            } else {
                rosterFields.style.display = 'none';
            }
        }

        // Form Submission Logic
        document.getElementById('workspaceForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const payload = {
                name: document.getElementById('wsName').value,
                folder_type: document.getElementById('wsType').value,
                expected_time: document.getElementById('wsTime').value,
                buffer_mins: document.getElementById('wsBuffer').value
            };

            try {
                const response = await fetch('/api/workspace', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    location.reload(); // Reload page to show the new folder
                } else {
                    alert('Error creating workspace');
                }
            } catch (error) {
                console.error(error);
                alert('Failed to connect to server');
            }
        });
    </script>

</body>
</html>
